name: PixMate

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PixMate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PixMate
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.pixmate
        PRODUCT_NAME: PixMate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: PixMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: 像素搭档
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: 用于「手机模式」直接拍摄，以及识别取景画面中的人物以给出构图与姿势建议。
        NSPhotoLibraryUsageDescription: 用于把精修后的照片保存到相册。
        NSPhotoLibraryAddUsageDescription: 用于把精修后的照片保存到相册。
        NSLocalNetworkUsageDescription: 用于通过 Wi-Fi 与相机建立无线联机。
    dependencies:
      - sdk: ImageCaptureCore.framework
      - sdk: Vision.framework
      - sdk: CoreImage.framework
      - sdk: CoreML.framework
      - sdk: Photos.framework
      - sdk: AVFoundation.framework
      - sdk: Metal.framework

# 显式声明 scheme —— 云端构建（xcodebuild -scheme PixMate）必须有它，
# 否则 XcodeGen 生成的工程里没有 shared scheme，CI 会报 scheme not found
schemes:
  PixMate:
    build:
      targets:
        PixMate: all
    run:
      config: Debug
    archive:
      config: Release
