name: Build unsigned IPA

# 推到 main 就自动构建，也可以在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 免费额度内的 macOS 机器（GitHub 公共仓库完全免费）
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 确认 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 不签名打包：产物是未签名 ipa，装到手机时由 Sideloadly / AltStore
      # 用你的 Apple ID 重新签名（免费账号 7 天有效期）
      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project PixMate.xcodeproj \
            -scheme PixMate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PixMate.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "没有找到 PixMate.app，构建产物目录："
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload PixMate-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PixMate-unsigned.ipa Payload
          ls -lh PixMate-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PixMate-unsigned-ipa
          path: PixMate-unsigned.ipa
          retention-days: 30
